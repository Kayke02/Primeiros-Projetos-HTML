<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Formulário de Cadastro</title>
        <link rel="stylesheet" href="estilo1.css">
    </head>
    <body>
        <h1>Cadastro</h1>
        <form action="receber.php" method="post" onsubmit="return validar()">
            <fieldset>
                <legend>Dados Cadastrais</legend>
                
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" maxlength="60">
                <br>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" required>
                <br>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" maxlength="60" required>
            </fieldset>
            
            <fieldset>
                <legend>Dados do Produto</legend>
                
                <label for="produtos">Produto:</label>
                <select id="produtos" name="produto" required> 
                    <option value="ovo">Ovo</option>
                    <option value="farinha">Farinha</option>
                    <option value="pao">Pão</option>
                    <option value="nescau">Nescau</option>
                    <option value="farinha_tapioca">Farinha de Tapioca</option>
                    <option value="cafe">Café</option>
                </select>
                
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade" required>
            </fieldset>
            
            <button type="submit">Enviar</button>
            <button type="reset">Resetar</button>
        </form>
        <script>
        function validar() {
            var campoNome = document.getElementById("nome");
            if (campoNome.value.trim() === "") {
                alert("O campo Nome não pode ficar vazio!");
                campoNome.focus();
                return false;
            }
            return true;
        }
    </script>
    </body>
</html>
